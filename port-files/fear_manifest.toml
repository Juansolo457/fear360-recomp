# Model animations step by the exact time that passed (port-nx/src/anim_timing.h); the
# addresses are this build's, found by tools/find_anim_sites.py.
[[entrypoint.midasm_hook]]
name = "FearAnimFrameMs"       # msDelta = seconds * 1000, model animation update
address = 0x8221F1EC
registers = ["r3", "f0"]

[[entrypoint.midasm_hook]]
name = "FearAnimFrameMs"       # the same, the other caller
address = 0x8227EED4
registers = ["r3", "f0"]

[[entrypoint.midasm_hook]]
name = "FearAnimTrackerMs"     # msDelta * rate in trk_Update
address = 0x821C6A3C
registers = ["r3", "f0"]
