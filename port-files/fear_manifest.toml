# F.E.A.R. Files (Xbox 360, title 565507E8, default.xex SHA-256
# a51deed1dc0842af32a3a2b811674552f4ae5b6339ce8b9abe0eabe14ba6c7eb), ReXGlue 0.10.
# The project keeps port-nx's name ("fear") so its CMake glue and host code apply unchanged.

[project]
name = "fear"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
includes = []

# The translator's register options (#34, docs/HANDOFF-REGOPTS.md), as in port-nx's manifest:
# stage B (non_argument_as_local, stage C, isn't tested yet).
skip_lr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
# non_argument_as_local = true
non_volatile_as_local = true
setjmp_address = 0x82B95310
longjmp_address = 0x82B94EC0

# Tail-call targets the analyser misses (first translation, 2026-10-22, docs/FILES.md).
