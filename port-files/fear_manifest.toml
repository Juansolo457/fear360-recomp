# The C runtime's _CallSettingFrame (port-nx's manifest has why).
0x828A0000 = { share_registers = true }
# Havok's constraint solver passes a constant in v92 to sub_828E6D88's two callees
# (port-nx's manifest has why; this build's addresses).
0x828E6D88 = { share_registers = true }
0x828F3F50 = { share_registers = true }
0x828F4600 = { share_registers = true }
# Inline __finally blocks that their owner reaches by a conditional branch (bge cr6,block)
# and that go on using the owner's r31 (mr r8,r8; addi r12,r31,N; bl funclet; ...;
# b __restgprlr_N). They were already entries here (tail-call targets from the first
# translation), which is why the funclet sweep never marks them; with the register options they
# would read r31 as 0 on an ordinary path (a loop's exit).
# The owner hands its registers over at the branch (SDK patch 0010). None in F.E.A.R.
0x821A989C = { share_registers = true }
0x82876988 = { share_registers = true }
0x8288CB54 = { share_registers = true }
0x82891440 = { share_registers = true }
0x82893D88 = { share_registers = true }
0x82B983F0 = { share_registers = true }

# Model animations step by the exact time that passed (port-nx/src/anim_timing.h); the
# addresses are this build's, found by tools/find_anim_sites.py.
[[entrypoint.midasm_hook]]
name = "FearAnimFrameMs"       # msDelta = seconds * 1000, model animation update
address = 0x8221F1EC
registers = ["r3", "f0"]

[[entrypoint.midasm_hook]]
name = "FearAnimFrameMs"       # the same, the other caller
address = 0x8227EED4
registers = ["r3", "f0"]

[[entrypoint.midasm_hook]]
name = "FearAnimTrackerMs"     # msDelta * rate in trk_Update
address = 0x821C6A3C
registers = ["r3", "f0"]

# Right-stick tuning (port-nx/src/look_tuning.*). Files keeps its game database in the catalogue,
# so the values are swapped as the game copies them into console variables: VarTrack::Init
# (sub_822C4B28: name in r5, the database's value in f1), at its entry. The stick's are read in
# sub_82350318 (GPadAimEdge*, TurningSoftLock*).
[[entrypoint.midasm_hook]]
name = "FearConsoleVarDefault"
address = 0x822C4B28
registers = ["r5", "f1"]

# PC Settings, Switch Game and Quit to Desktop in the main menu (port-nx/src/fear_menu.*), as in
# F.E.A.R. CScreenMain::Build (sub_823EAAC0) ends at 0x823EAF24, where both its paths meet: add
# our items after Options.
[[entrypoint.midasm_hook]]
name = "FearMenuAddItems"
address = 0x823EAF24
registers = ["r1", "r23", "r24", "r25", "r26", "r27", "r28", "r29", "r30"]

# OnCommand's command 21 (Press Start accepted) has shown the game's items: show ours.
[[entrypoint.midasm_hook]]
name = "FearMenuShowItems"
address = 0x823EB274
registers = ["r1", "r31"]

# CScreenMain::OnCommand (sub_823EAF68): our commands are handled by the host (r3 = 1).
[[entrypoint.midasm_hook]]
name = "FearMenuCommand"
address = 0x823EAF68
registers = ["r3", "r4"]
return_on_true = true

# High-FPS fixes (src/high_fps.h): the AI's update delay (0.01 s) made shorter than a frame, so
# enemies update every frame above 100 fps (a severed body keeps it). SetNextServerUpdate, at its
# fmr f31,f1: the character in r3, the delay in f1.
[[entrypoint.midasm_hook]]
name = "FearAiNextUpdate"
address = 0x8266F638
registers = ["r3", "f1"]

# Screen bloom strength and threshold (port-nx/src/bloom.h, #38): after both are read
# (threshold in f1, strength in f31), before they go to the bloom material.
[[entrypoint.midasm_hook]]
name = "FearBloomParams"
address = 0x82390ED4
registers = ["f1", "f31"]

# Particle batch markers (port-nx/src/high_fps.h, #7, #38): lifetime 0 instead of -1, at the store
# of the -1.0 in AddParticleBatchMarker and in its copy inlined in EmitParticleBatch.
[[entrypoint.midasm_hook]]
name = "FearParticleBatchMarker"
address = 0x82B7BAA4
registers = ["f0"]

[[entrypoint.midasm_hook]]
name = "FearParticleBatchMarker"
address = 0x82B7C88C
registers = ["f0"]

# Profiler (src/profiler.h, #30): Direct3D's own bookkeeping of each wait for the GPU, at the
# start of the function that records a wait's start (the reason in r5) and of the one that records
# its end. Only noted while fear_profile is on.
[[entrypoint.midasm_hook]]
name = "FearD3DWaitBegin"
address = 0x82973648
registers = ["r5"]

[[entrypoint.midasm_hook]]
name = "FearD3DWaitEnd"
address = 0x82973678
registers = []

# Native C runtime (#31, docs/ARCHITECTURE.md): these guest functions are replaced by the SDK's
# host versions (third_party/rexglue-sdk-nx/src/kernel/crt/memory.cpp), which take the same guest
# pointers. Files' XDK memcpy has a 4-byte fast path F.E.A.R.'s lacks; same semantics.
[entrypoint.rexcrt]
memcpy = 0x828728A0
memset = 0x82871980
