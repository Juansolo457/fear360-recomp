# The C runtime's _CallSettingFrame calls an SEH funclet with the frame in r12 (mr r12,r4;
# mtlr r3; blrl): under the register options it keeps r12 and the non-volatiles in the context,
# as the funclets themselves do.
0x82BC0B70 = { share_registers = true }
# Havok's constraint solver (sub_828F0DA0, sub_828F2840, sub_828F4FC8, sub_828F7018) computes a
# constant into v92 and calls sub_828F0790, whose three callees read v92 without ever writing
# it (docs/HANDOFF-REGOPTS.md, review finding 2). These four keep every register in the context
# so the value reaches them; the solver hands its v92 over at the call (SDK patch 0012) and the
# save/restore helpers they call work through the context (patch 0011).
0x828F0790 = { share_registers = true }
0x828FD958 = { share_registers = true }
0x828FE008 = { share_registers = true }
0x828FE588 = { share_registers = true }

