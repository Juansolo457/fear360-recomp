# F.E.A.R. (Xbox 360, title 565507D9, default.xex SHA-256
# e7fccdf6dd57bb58d10efbdd0b2ca567b8cece5b6a3fc696c7fca879aaea2792), ReXGlue 0.10.

[project]
name = "fear"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
includes = []

# The translator's register options (#34, docs/HANDOFF-REGOPTS.md): these registers become each
# generated function's C++ locals instead of fields of the shared context, so the host compiler
# can keep them in host registers. Needs the SDK's patches 0007-0012. skip_msr stays off: it drops
# the global lock that the 202 mtmsrd sites take.
skip_lr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
# Stage B (docs/HANDOFF-REGOPTS.md section 4): non_volatile_as_local with setjmp/longjmp on top of
# the five above. Stage C: non_argument_as_local too (r0, r2, r11, r12, f0, v32-v63; the r12
# funclets need patch 0007). Section 8 has the scan of what reads them from a caller.
non_argument_as_local = true
non_volatile_as_local = true
# The C runtime's setjmp and longjmp (libpng, libjpeg and the shader compilers' error paths):
# their jmp_buf can't reach registers that are locals, so these calls become host ones.
setjmp_address = 0x82BBA450
longjmp_address = 0x82BBA200

