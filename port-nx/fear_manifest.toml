# F.E.A.R.: model animations step by the exact time that passed, not whole milliseconds a frame
# (src/anim_timing.h). Each hook runs just before the fctidz that drops the fraction.
[[entrypoint.midasm_hook]]
name = "FearAnimFrameMs"       # msDelta = seconds * 1000, model animation update
address = 0x82241604
registers = ["r3", "f0"]

[[entrypoint.midasm_hook]]
name = "FearAnimFrameMs"       # the same, the other caller
address = 0x821E4DDC
registers = ["r3", "f0"]

[[entrypoint.midasm_hook]]
name = "FearAnimTrackerMs"     # msDelta * rate in trk_Update
address = 0x82191E7C
registers = ["r3", "f0"]

# Debugging (src/fx_debug.cpp, fear_debug_model_fx): model effects' lifetime, color and scale,
